name: test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install separate fixture and verification dependencies
        run: python -m pip install Pillow==12.0.0 pillow-heif==1.8.1
      - name: Ensure Ubuntu ImageMagick command exists
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libheif-plugin-libde265
      - name: Small fictional conversion and refusal tests
        run: python -m unittest -v
